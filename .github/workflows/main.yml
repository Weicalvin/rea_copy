name: REA backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-checks:
    name: check:fast and HTTP boundary tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run fast checks
        run: npm run check:fast

      - name: Run HTTP boundary tests
        run: >-
          npx vitest run
          tests/boundary/mcp/apkAnalysisHttp.test.ts
          tests/boundary/mcp/httpTransport.test.ts
          --reporter=dot
